name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Runs before anything needs the network or a sibling checkout: if go.mod
      # has a replace pointing outside the repository, the Docker image build
      # cannot resolve it and would fail only at release time.
      - name: Check dependencies are buildable outside the repository
        run: bash .github/scripts/check-lingma-protocol-go-pin.sh
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output
